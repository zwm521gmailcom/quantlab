<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantLab · 回测中心</title><link rel="stylesheet" href="/assets/app.css?v=20260906ai"></head><body><div class="shell"><aside><h1>QuantLab</h1><nav><a href="/">研究总览</a><a href="/data">数据中心</a><a href="/factors">因子库</a><a href="/research/factors">因子研究</a><a href="/backtests/new" aria-current="page">回测中心</a></nav></aside><main class="main"><p class="eyebrow">回测工作台</p><h2>回测中心</h2><p class="muted">冻结数据、因子、模型和撮合配置后提交回测。</p><section class="panel"><label>回测名称 <input id="name" value="未命名回测"></label><label>股票范围 <select id="scope"><option>中国A股（SH/SZ）</option></select></label><label>Top N <input id="topN" type="number" value="10" min="1"></label><label>调仓间隔（交易日） <input id="rebalance" type="number" value="1" min="1"></label><label>持仓天数（交易日） <input id="holding" type="number" value="2" min="1"></label><label>买入价格 <select id="buy"><option value="open">未复权开盘价</option><option value="hfq_open">后复权开盘价</option></select></label><label>卖出价格 <select id="sell"><option value="close">未复权收盘价</option><option value="hfq_close">后复权收盘价</option></select></label><label>买入费率 <input id="buyFee" value="0.0003"></label><label>卖出费率 <input id="sellFee" value="0.0005"></label><label>印花税（卖出） <input id="stampTax" value="0.001"></label><label>买入最低费用 <input id="buyMin" value="5"></label><label>卖出最低费用 <input id="sellMin" value="5"></label><label>滑点 <input id="slippage" value="0.0005"></label><label>初始资金 <input id="capital" value="1000000"></label><label>基准 <input id="benchmark" value="000300.SH"></label><button id="preview">过滤预览</button><button id="submit">提交回测</button><pre id="output" aria-live="polite"></pre></section></main></div><script src="/assets/bootstrap.js"></script><script src="/assets/nav.js?v=20260911asset"></script><script>const q=id=>document.getElementById(id);const config=()=>({submission_token:crypto.randomUUID(),name:q('name').value,dataset_id:'ds_canonical_market',dataset_version_id:'v1',strategy_entity_id:'strategy_momentum',strategy_version_id:'v1',factor_versions:[{factor_id:'factor_momentum_5',version_id:'v1'}],model:{entity_id:'model_lgbm',version_id:'v1'},stock_scope:q('scope').value,train:{date_from:'2019-01-01',date_to:'2019-12-31',filter:{st_status:0,suspended:false}},test:{date_from:'2020-01-01',date_to:'2020-12-31',filter:{st_status:0,suspended:false}},top_n:+q('topN').value,weighting:'equal',rebalance_every:+q('rebalance').value,holding_days:+q('holding').value,signal_time:'close',buy_price:q('buy').value,sell_price:q('sell').value,buy_fee_rate:+q('buyFee').value,buy_fee_minimum:+q('buyMin').value,sell_fee_rate:+q('sellFee').value,sell_fee_minimum:+q('sellMin').value,stamp_tax_rate:+q('stampTax').value,slippage:+q('slippage').value,initial_capital:+q('capital').value,benchmark:q('benchmark').value,missing_policy:{valuation:'drop',technical:'drop'},hyperparameters:{number_of_trees:5,max_bins:511}});async function call(url){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(config())});q('output').textContent=JSON.stringify(await r.json(),null,2)}q('preview').onclick=()=>call('/api/backtests/preview');q('submit').onclick=()=>call('/api/backtests');</script></body></html>
