<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuantLab · 回测计划</title>
  <link rel="stylesheet" href="/assets/app.css?v=20260909plan13">
</head>
<body>
<div class="shell">
  <aside>
    <h1>QuantLab</h1>
    <nav aria-label="主导航">
      <a href="/">研究总览</a>
      <a href="/data">数据中心</a>
      <a href="/kline">标准行情宽表</a>
      <a href="/research/factors">因子研究</a>
      <a href="/models">模型中心</a>
      <a href="/backtests/new">回测中心</a>
      <a href="/backtests/plan" aria-current="page">回测计划</a>
      <a href="/backtests/runs">结果档案</a>
      <a href="/settings">设置</a>
    </nav>
  </aside>
  <main class="main plan-page">
    <div class="top">
      <div>
        <div class="eyebrow">回测工作台</div>
        <div class="title">回测计划</div>
        <div class="sub">先把要跑的回测写进清单。全选后点开始，系统一笔接一笔跑，前一笔完成或失败后再跑下一笔。</div>
      </div>
      <div class="actions">
        <button id="new-plan" class="btn" type="button">新建计划</button>
        <a class="btn" href="/backtests/new">新建回测</a>
        <a class="btn" href="/backtests/runs">结果档案</a>
        <button id="select-all" class="btn" type="button">全选</button>
        <button id="delete-items" class="btn danger" type="button">删除任务</button>
        <button id="start" class="btn primary" type="button">开始</button>
        <button id="close-plan" class="btn" type="button">完结</button>
        <button id="stop" class="btn danger" type="button" disabled>停止计划</button>
      </div>
    </div>
    <div id="banner" class="banner"><strong>计划状态：</strong><span id="banner-text">还没有回测计划。可从回测中心点「加入计划」，或等写入任务后再全选开始。</span></div>
    <label class="plan-pick">当前计划
      <span class="plan-pick-row">
        <select id="plan-select" class="select"></select>
        <button id="delete-plan" class="btn danger" type="button">删除</button>
      </span>
    </label>
    <div id="plan-state" class="state">正在加载…</div>
    <div class="archive-table plan-table" id="plan-table"></div>
    <div id="plan-pagination" class="archive-pagination"></div>
  </main>
</div>
<div id="plan-dialog" class="file-config-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="plan-dialog-title">
  <div class="file-config-panel plan-dialog">
    <div class="file-config-head">
      <h3 id="plan-dialog-title">新建回测计划</h3>
      <button id="plan-dialog-cancel" class="btn" type="button">取消</button>
    </div>
    <label>计划名称
      <input id="plan-name" class="input" maxlength="80" autocomplete="off">
    </label>
    <p class="form-note">系统会生成计划 ID 作为主键。完结后这份计划不会再出现在回测中心的下拉框里。</p>
    <div class="actions">
      <button id="plan-dialog-save" class="btn primary" type="button">创建</button>
    </div>
  </div>
</div>
<script src="/assets/table-pager.js?v=20260909pager"></script>
<script src="/assets/backtest/plan.js"></script>
<script src="/assets/nav.js?v=20260911asset"></script>
</body>
</html>
