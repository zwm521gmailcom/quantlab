      <aside><h1>QuantLab</h1><nav aria-label="主导航"><a href="/factors">因子研究</a></nav></aside>

        <nav class="page-back" aria-label="返回路径"><a href="/qlib/runs">← 挖因子记录</a></nav>
        <div class="eyebrow">Qlib</div>
        <h2>筛选结果</h2>
        <p>只留下测试年化高于该轮基准、并且信息比率为正的因子。公式里只换 Ref、Mean、Std 窗口的算同一类，一类只留信息比率最高的一条；信息比率相同则留更早写出的那条。验证 IC、测试 IC 为负而年化为正，表示模型在做低因子值。</p>
        <div id="qlib-picks-error" class="state error hidden"></div>

          <p id="qlib-picks-summary" class="form-note">正在读取。</p>
          <div id="qlib-picks-board" class="qlib-picks-board hidden"></div>
          <p id="qlib-picks-empty" class="form-note hidden">还没有过线的因子。</p>
          <div class="archive-table">
            <table class="archive-grid qlib-runs-grid">
              <thead>
                <tr>
                  <th class="source">出处</th>
                  <th>编号</th>
                  <th class="num">轮次</th>
                  <th>因子</th>
                  <th>公式</th>
                  <th class="num">验证</th>
                  <th class="num">测试</th>
                  <th class="num">测试年化</th>
                  <th class="num">基准</th>
                  <th class="num">回撤</th>
                  <th class="num">信息比率</th>
                  <th class="num">同类</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="qlib-picks-body"></tbody>
            </table>
          </div>
        </section>
