<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuantLab · 结果档案</title>
  <link rel="stylesheet" href="/assets/app.css?v=20260911navadapt3">
</head>
<body>
<div class="shell">
  <aside>
    <h1>QuantLab</h1>
    <nav aria-label="主导航">
      <a href="/">研究总览</a>
      <a href="/data">数据中心</a>
      <a href="/kline">标准行情宽表</a>
      <a href="/data/factors">因子数据</a>
      <a href="/factors">因子库</a>
      <a href="/research/factors">因子研究</a>
      <a href="/models">模型中心</a>
      <a href="/backtests/new">回测中心</a>
      <a href="/backtests/runs" aria-current="page">结果档案</a>
      <a href="/settings">设置</a>
    </nav>
  </aside>
  <main class="archive-page">
    <div class="eyebrow">结果档案</div>
    <h2>结果档案</h2>
    <p>先查看回测清单，再进入单条运行记录。复制配置只进入回测中心，不会自动运行。</p>
    <div class="archive-root">结果保存总目录：<code id="archive-root">运行时结果目录</code></div>
    <section class="card">
      <div class="data-toolbar">
        <label>搜索名称/ID/模型/因子<input id="query" placeholder="输入关键词"></label>
        <label>状态
          <select id="status">
            <option value="">全部状态</option>
            <option value="completed">已完成</option>
            <option value="running">运行中</option>
            <option value="queued">排队中</option>
            <option value="failed">失败</option>
          </select>
        </label>
        <label>模型<input id="strategy" placeholder="模型名称或ID"></label>
        <label>测试开始<input id="dateFrom" type="date"></label>
        <label>测试结束<input id="dateTo" type="date"></label>
        <label>排序
          <select id="sort">
            <option value="created_at">创建时间</option>
            <option value="name">名称</option>
            <option value="return">累计收益</option>
            <option value="status">状态</option>
          </select>
        </label>
        <button id="refresh" class="primary">查询</button>
        <a id="export" class="button-link" href="/api/backtests/runs.csv">导出清单</a>
      </div>
      <div id="archive-state" class="state" aria-live="polite">正在加载…</div>
      <div class="archive-table" id="archive-table"></div>
      <div id="archive-pagination" class="archive-pagination"></div>
    </section>
  </main>
</div>
<script src="/assets/table-pager.js?v=20260909pager"></script>
<script src="/assets/backtest/archive.js?v=20260911archivecols"></script>
<script src="/assets/nav.js?v=20260911ver"></script>
</body>
</html>
