<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantLab · 系统设置</title><link rel="stylesheet" href="/assets/app.css?v=20260906ai"></head><body><div class="shell"><aside><h1>QuantLab</h1><nav aria-label="主导航"><a href="/">研究总览</a><a href="/data">数据中心</a><a href="/kline">标准行情宽表</a><a href="/data/factors">因子数据</a><a href="/factors">因子库</a><a href="/research/factors">因子研究</a><a href="/models">模型中心</a><a href="/backtests/new">回测中心</a><a href="/backtests/runs">结果档案</a><a href="/settings" aria-current="page">设置</a></nav></aside><main><div class="eyebrow">系统设置</div><h2>系统设置</h2><p>设置仅用于新建草稿；历史运行配置保持不变。数据扫描必须手动触发。</p><div id="settings-error" class="state error hidden"></div><section class="card"><h3>路径与运行环境</h3><pre id="settings-paths" class="config-block">加载中…</pre><button id="scan" type="button">手动扫描目录</button><span id="scan-result"></span></section><section class="card"><h3>Tushare API Key</h3><p class="muted">只用于下载 raw 数据；保存后不显示原文，仅显示是否已配置。</p><div class="settings-fields"><label>API Key <input id="tushare-token" type="password" autocomplete="off" placeholder="粘贴 Tushare Token"></label></div><div class="settings-actions"><button id="tushare-token-save" type="button">保存 API Key</button><button id="tushare-token-clear" type="button">清除</button><span id="tushare-token-status" class="state"></span></div></section><section class="card"><h3>新草稿默认回测参数</h3><form id="settings-form"><div class="settings-fields"><label>Top N <input id="top-n" type="number" min="1" max="1000"></label><label>调仓间隔（交易日） <input id="rebalance-days" type="number" min="1"></label><label>初始资金 <input id="capital" type="number" min="0"></label><label>基准 <input id="benchmark"></label></div><div class="settings-actions"><button type="submit">保存设置</button><button id="reset" type="button">恢复默认值</button></div></form><p id="saved" class="state"></p></section></main></div><script>const $=id=>document.getElementById(id);async function load(){const r=await fetch('/api/settings');const x=await r.json();$('settings-paths').textContent=JSON.stringify({paths:x.paths,environment:x.environment,secrets:x.secrets},null,2);$('top-n').value=x.defaults.top_n;$('rebalance-days').value=x.defaults.rebalance_days;$('capital').value=x.defaults.capital;$('benchmark').value=x.defaults.benchmark}$('settings-form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({defaults:{top_n:+$('top-n').value,rebalance_days:+$('rebalance-days').value,capital:+$('capital').value,benchmark:$('benchmark').value}})});$('saved').textContent=r.ok?'已保存（仅影响新草稿）':'保存失败';if(r.ok)load()};$('reset').onclick=async()=>{await fetch('/api/settings/reset',{method:'POST'});load()};$('scan').onclick=async()=>{const x=await (await fetch('/api/settings/scan',{method:'POST'})).json();$('scan-result').textContent=` 已扫描 ${x.roots.length} 个目录`};load();</script><script>async function refreshTushareTokenStatus(){const input=document.getElementById("tushare-token");const status=document.getElementById("tushare-token-status");const r=await fetch("/api/settings/tushare-token");if(r.ok){const p=await r.json();input.value="";input.placeholder=p.configured?"已配置（输入新值可覆盖）":"未配置，输入 Tushare Token";status.textContent=p.configured?"已配置":"未配置"}}document.getElementById("tushare-token-save").addEventListener("click",async()=>{const token=document.getElementById("tushare-token").value.trim();const r=await fetch("/api/settings/tushare-token",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token})});const p=await r.json();document.getElementById("tushare-token-status").textContent=r.ok?(p.configured?"已保存":"已清除"):"保存失败";if(r.ok)refreshTushareTokenStatus()});document.getElementById("tushare-token-clear").addEventListener("click",async()=>{await fetch("/api/settings/tushare-token",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:""})});refreshTushareTokenStatus()});refreshTushareTokenStatus();</script><script src="/assets/nav.js?v=20260907a"></script></body></html>
