<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuantLab · 研究总览</title>
    <link rel="stylesheet" href="/assets/app.css?v=20261003charts3">
  </head>
  <body>
    <div class="shell">
      <aside>
        <h1>QuantLab</h1>
        <nav aria-label="主导航">
          <a href="/" aria-current="page">研究总览</a>
          <a href="/data">数据中心</a>
          <a href="/kline">标准行情宽表</a>
          <a href="/research/factors">因子研究</a>
          <a href="/models">模型中心</a>
          <a href="/backtests/new">回测中心</a>
          <a href="/backtests/runs">结果档案</a>
          <a href="/settings">设置</a>
        </nav>
      </aside>
      <main class="dash">
        <header class="dash-hero">
          <div>
            <div class="eyebrow">研究台</div>
            <h2>研究总览</h2>
          </div>
          <div class="dash-hero-aside">
            <div id="dataset-summary" class="dash-live">正在连接本地服务…</div>
          </div>
        </header>
        <div id="loading-state" class="state">正在读取筛选结果…</div>
        <div id="empty-state" class="state hidden"></div>
        <div id="error-state" class="state error hidden"></div>
        <div class="dash-charts">
          <section class="dash-chart">
            <h3>测试信息比率</h3>
            <div id="chart-ir"></div>
          </section>
          <section class="dash-chart">
            <h3>超额年化</h3>
            <div id="chart-excess"></div>
          </section>
          <section class="dash-chart">
            <h3>信息比率与超额年化</h3>
            <div id="chart-scatter"></div>
          </section>
          <section class="dash-chart">
            <h3>最大回撤</h3>
            <div id="chart-drawdown"></div>
          </section>
          <section class="dash-chart">
            <h3>测试 IC</h3>
            <div id="chart-test-ic"></div>
          </section>
          <section class="dash-chart">
            <h3>基准年化</h3>
            <div id="chart-benchmark"></div>
          </section>
          <section class="dash-chart">
            <h3>验证 IC 与测试 IC</h3>
            <div id="chart-ic-pair"></div>
          </section>
          <section class="dash-chart">
            <h3>回测类型</h3>
            <div id="chart-kinds"></div>
          </section>
          <section class="dash-chart">
            <h3>回测完成情况</h3>
            <div id="chart-status"></div>
          </section>
          <section class="dash-chart">
            <h3>挖因子账本年化</h3>
            <div id="chart-annual-topk"></div>
          </section>
          <section class="dash-chart">
            <h3>多因子回测年化</h3>
            <div id="chart-annual-multi"></div>
          </section>
          <section class="dash-chart">
            <h3>单因子回测年化</h3>
            <div id="chart-annual-single"></div>
          </section>
          <section class="dash-chart">
            <h3>LightGBM 年化</h3>
            <div id="chart-annual-lgb"></div>
          </section>
          <section class="dash-chart">
            <h3>挖因子账本回撤</h3>
            <div id="chart-dd-topk"></div>
          </section>
          <section class="dash-chart">
            <h3>多因子回测回撤</h3>
            <div id="chart-dd-multi"></div>
          </section>
          <section class="dash-chart">
            <h3>因子计算 IC</h3>
            <div id="chart-factor-ic"></div>
          </section>
          <section class="dash-chart">
            <h3>因子覆盖率</h3>
            <div id="chart-coverage"></div>
          </section>
          <section class="dash-chart">
            <h3>版本质量</h3>
            <div id="chart-quality"></div>
          </section>
          <section class="dash-chart">
            <h3>数据集行数</h3>
            <div id="chart-datasets"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="/assets/shared/dom.js"></script>
    <script src="/assets/shared/fetch.js"></script>
    <script src="/assets/data/overview.js?v=20261003charts3"></script>
    <script src="/assets/bootstrap.js"></script>
    <script src="/assets/nav.js?v=20260930nojobs"></script>
  </body>
</html>
